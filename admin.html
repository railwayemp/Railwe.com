<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TA Record — Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F3F4F6;
    color: #1A2744;
  }
  header {
    background: linear-gradient(135deg,#1A2744 0%,#2A3F6F 100%);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 800; }
  header .sub { font-size: 11px; opacity: .75; margin-top: 2px; }
  #signOutBtn {
    background: rgba(255,255,255,.12);
    border: none; color: #fff; padding: 7px 14px; border-radius: 20px;
    font-size: 12px; cursor: pointer;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .section-title {
    font-size: 12px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .04em; color: #6B7280; margin: 26px 0 10px;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: #E5E7EB; flex-shrink: 0; object-fit: cover; }
  .info { flex: 1; min-width: 0; }
  .info .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .email { font-size: 12px; color: #6B7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    border: none; border-radius: 20px; padding: 8px 16px; font-size: 12px;
    font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-approve { background: #16A34A; color: #fff; }
  .btn-revoke { background: #FEE2E2; color: #B91C1C; }
  .btn:disabled { opacity: .5; cursor: default; }
  .empty { font-size: 13px; color: #9CA3AF; padding: 20px 0; text-align: center; }
  #loginGate {
    position: fixed; inset: 0; background: linear-gradient(135deg,#1A2744 0%,#2A3F6F 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999;
  }
  #loginGate .box {
    background: #fff; border-radius: 14px; padding: 40px 36px; max-width: 360px;
    width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  #loginGate h1 { font-size: 17px; margin-bottom: 6px; }
  #loginGate p { font-size: 13px; color: #6B7280; margin-bottom: 22px; }
  #deniedMsg { color: #B91C1C; font-size: 12px; margin-top: 14px; display: none; line-height:1.5; }
  #signInBtn {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    max-width:260px; margin:0 auto; padding:11px 18px; border:1px solid #DADCE0;
    border-radius:24px; background:#fff; color:#3c4043; font-size:14px; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<div id="loginGate">
  <div class="box">
    <h1>🔒 TA Record — Admin</h1>
    <p>Sign in with the admin Google account to manage access.</p>
    <button id="signInBtn" onclick="startAdminSignIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6 29.3 4 24 4c-7.4 0-13.8 4.2-17 10.3z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2C40.4 36.4 44 30.8 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <p id="deniedMsg"></p>
  </div>
</div>

<header id="appHeader" style="display:none;">
  <div>
    <h1>TA Record — Admin</h1>
    <div class="sub" id="adminEmailLabel"></div>
  </div>
  <button id="signOutBtn" onclick="adminSignOut()">Sign out</button>
</header>

<main id="appMain" style="display:none;">
  <div class="section-title">Pending requests</div>
  <div id="pendingList"><div class="empty">Loading…</div></div>

  <div class="section-title">Approved users</div>
  <div id="approvedList"><div class="empty">Loading…</div></div>
</main>

<script>
  // ═══ CONFIG ═══
  const ADMIN_EMAIL = 'pnkjverma8@gmail.com';

  const firebaseConfig = {
    apiKey: "AIzaSyCke76gcsy0v4TMyCj_GO4DWryuj5vxhOQ",
    authDomain: "ndata-d2a16.firebaseapp.com",
    databaseURL: "https://ndata-d2a16-default-rtdb.firebaseio.com",
    projectId: "ndata-d2a16",
    storageBucket: "ndata-d2a16.firebasestorage.app",
    messagingSenderId: "662753516550",
    appId: "1:662753516550:web:83f8101e2d6f2a1b263787"
  };
  firebase.initializeApp(firebaseConfig);
  const fdb = firebase.database();
  const fauth = firebase.auth();
  const googleProvider = new firebase.auth.GoogleAuthProvider();

  function showDenied(msg) {
    const el = document.getElementById('deniedMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function startAdminSignIn() {
    document.getElementById('deniedMsg').style.display = 'none';
    fauth.signInWithPopup(googleProvider).catch(function(err) {
      if (err.code === 'auth/popup-blocked') {
        showDenied('Your browser blocked the sign-in popup. Please allow popups and try again.');
      } else if (err.code !== 'auth/cancelled-popup-request' && err.code !== 'auth/popup-closed-by-user') {
        showDenied('Sign-in failed: ' + err.message);
      }
    });
  }

  function adminSignOut() {
    fauth.signOut().finally(function() { location.reload(); });
  }

  function enterAdmin(user) {
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('appHeader').style.display = 'flex';
    document.getElementById('appMain').style.display = 'block';
    document.getElementById('adminEmailLabel').textContent = user.email;
    loadLists();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function loadLists() {
    fdb.ref('accessRequests').on('value', function(reqSnap) {
      fdb.ref('allowedUsers').once('value').then(function(allowSnap) {
        const requests = reqSnap.val() || {};
        const allowed = allowSnap.val() || {};
        const pendingEl = document.getElementById('pendingList');
        const keys = Object.keys(requests).filter(function(k) { return allowed[k] !== true; });
        pendingEl.innerHTML = keys.length === 0
          ? '<div class="empty">No pending requests</div>'
          : keys.map(function(k) { return renderCard(k, requests[k], false); }).join('');
      });
    });

    fdb.ref('allowedUsers').on('value', function(allowSnap) {
      fdb.ref('accessRequests').once('value').then(function(reqSnap) {
        const allowed = allowSnap.val() || {};
        const requests = reqSnap.val() || {};
        const approvedEl = document.getElementById('approvedList');
        const keys = Object.keys(allowed).filter(function(k) { return allowed[k] === true; });
        approvedEl.innerHTML = keys.length === 0
          ? '<div class="empty">No approved users yet</div>'
          : keys.map(function(k) { return renderCard(k, requests[k] || { email: k, name: k }, true); }).join('');
      });
    });
  }

  function renderCard(key, r, isApproved) {
    const name = escapeHtml(r.name || r.email || key);
    const email = escapeHtml(r.email || key);
    const pic = r.picture ? escapeHtml(r.picture) : '';
    const avatar = pic ? '<img class="avatar" src="' + pic + '" alt="" />' : '<div class="avatar"></div>';
    const btn = isApproved
      ? '<button class="btn btn-revoke" onclick="revokeUser(\'' + key + '\')">Revoke</button>'
      : '<button class="btn btn-approve" onclick="approveUser(\'' + key + '\')">Approve</button>';
    return '<div class="card">' + avatar +
      '<div class="info"><div class="name">' + name + '</div><div class="email">' + email + '</div></div>' +
      btn + '</div>';
  }

  function approveUser(key) {
    fdb.ref('allowedUsers/' + key).set(true).catch(function(err) {
      alert('Could not approve: ' + err.message);
    });
  }
  function revokeUser(key) {
    fdb.ref('allowedUsers/' + key).remove().catch(function(err) {
      alert('Could not revoke: ' + err.message);
    });
  }

  // Init — react to real Firebase Auth state, restrict to admin email
  fauth.onAuthStateChanged(function(user) {
    if (!user) return;
    if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      showDenied('This Google account (' + user.email + ') is not authorized to view the admin panel.');
      fauth.signOut();
      return;
    }
    enterAdmin(user);
  });
</script>
</body>
</html>
